<f:layout name="Email" />

<!-- Email / CreateUserConfirmation
This mail will be send to the user, to confirm his new profile and set a password.
It's everytime activated.
Available variables: {user} User Object {hash} Hash to ensure authentication of link
-->

<f:section name="main">
    <h2><f:translate key="emailInvitationText1" /></h2>

    <p><f:translate key="emailInvitationText2" /></p>

    <div class="action">
        <f:link.action action="edit" controller="Invitation" absolute="1" pageUid="{f:cObject(typoscriptObjectPath:'lib.confirmInivitedUserPid')}" arguments="{user:user, hash:hash}" class="button"><f:translate key="emailCreateUserConfirmationLinkConfirm" /></f:link.action>
    </div>

    <p><f:translate key="emailCreateUserConfirmationText2" /></p>

    <div class="action">
        <f:link.action action="delete" controller="Invitation" absolute="1" pageUid="{f:cObject(typoscriptObjectPath:'lib.confirmInivitedUserPid')}" arguments="{user:user, hash:hash}" class="button-secondary"><f:translate key="emailCreateUserConfirmationLinkConfirmRefused" /></f:link.action>
    </div>
</f:section>
