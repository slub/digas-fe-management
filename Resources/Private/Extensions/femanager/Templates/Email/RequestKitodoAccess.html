<f:layout name="Email" />

<f:section name="main">
    <h2><f:translate key="requestKitodoAccess.email.heading" extensionName="digas_fe_management" /></h2>

    <h3><f:translate key="requestKitodoAccess.email.contactInfo" extensionName="digas_fe_management" /></h3>
    <table class="contact">
        <tr>
            <td class="label">Name:</td>
            <td><f:format.htmlentitiesDecode>{user.firstname}</f:format.htmlentitiesDecode> <f:format.htmlentitiesDecode>{user.lastname}</f:format.htmlentitiesDecode></td>
        </tr>
        <tr>
            <td class="label">E-Mail:</td>
            <td><f:format.htmlentitiesDecode>{user.email}</f:format.htmlentitiesDecode></td>
        </tr>
    </table>

    <f:if condition="{message}">
        <h3><f:translate key="requestKitodoAccess.email.messageHeading" extensionName="digas_fe_management" /></h3>
        <div class="quote"><f:format.nl2br><f:format.htmlentitiesDecode>{message}</f:format.htmlentitiesDecode></f:format.nl2br></div>
    </f:if>

    <h3><f:translate key="requestKitodoAccess.email.requestedDocumentsHeading" extensionName="digas_fe_management" /></h3>
    <f:render partial="Basket/Table" arguments="{documents:documents, showRemoveLink:0}" />
</f:section>

<f:section name="noFooter">1</f:section>
