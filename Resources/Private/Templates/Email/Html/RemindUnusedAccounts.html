<f:layout name="Email" />

<f:section name="main">
    <h2><f:translate extensionName="DigasFeManagement" key="remindUnusedAccounts.email.heading" languageKey="{languageKey}" /></h2>

    <p><f:translate extensionName="DigasFeManagement" key="remindUnusedAccounts.email.message" arguments="{0: '{unusedTimespan}', 1: '{deleteTimespan}'}" languageKey="{languageKey}" /></p>

    <p><f:translate extensionName="DigasFeManagement" key="remindUnusedAccounts.email.messageLogin" languageKey="{languageKey}" /></p>

    <div class="action">
        <f:link.external uri="{loginUrl}" class="button"><f:translate extensionName="DigasFeManagement" key="emailLinkLogin" languageKey="{languageKey}" /></f:link.external>
    </div>
</f:section>
